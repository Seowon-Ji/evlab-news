<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EV Lab News</title>

  <style>
    :root {
      --green: #126b2a;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --border: #c9d4cc;
      --background: #eef5f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px 10px 30px;
      background: var(--background);
      color: var(--text);
      font-family:
        Arial,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    .news-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .news-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      color: var(--green);
      font-size: 30px;
      font-weight: 700;
    }

    .language-toggle {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
    }

    .language-button {
      border: 0;
      border-radius: 999px;
      padding: 7px 14px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .language-button:hover {
      color: var(--green);
    }

    .language-button.active {
      background: var(--green);
      color: white;
    }

    #news-list {
      margin: 0;
      padding-left: 25px;
    }

    #news-list li {
      margin-bottom: 17px;
      padding-left: 4px;
      font-size: 18px;
      line-height: 1.55;
    }

    .news-date {
      white-space: nowrap;
    }

    .status-message {
      padding: 20px 0;
      color: var(--muted);
      font-size: 16px;
    }

    @media (max-width: 700px) {
      body {
        padding: 8px 4px 24px;
      }

      h2 {
        font-size: 25px;
      }

      .news-header {
        align-items: flex-start;
      }

      .language-button {
        padding: 6px 11px;
        font-size: 13px;
      }

      #news-list {
        padding-left: 23px;
      }

      #news-list li {
        font-size: 16px;
        line-height: 1.6;
      }
    }
  </style>
</head>

<body>
  <main class="news-container">
    <header class="news-header">
      <h2 id="section-title">NEWS</h2>

      <div
        class="language-toggle"
        role="group"
        aria-label="Language selection"
      >
        <button
          id="button-en"
          class="language-button active"
          type="button"
          data-language="en"
        >
          English
        </button>

        <button
          id="button-ko"
          class="language-button"
          type="button"
          data-language="ko"
        >
          한국어
        </button>
      </div>
    </header>

    <div id="status" class="status-message">
      Loading news...
    </div>

    <ul id="news-list" hidden></ul>
  </main>

  <script>
    const NEWS_FILE = "./news.json";

    let newsItems = [];
    let currentLanguage =
      localStorage.getItem("evlab-news-language") || "en";

    const sectionTitle = document.getElementById("section-title");
    const newsList = document.getElementById("news-list");
    const statusMessage = document.getElementById("status");
    const languageButtons =
      document.querySelectorAll(".language-button");

    async function loadNews() {
      try {
        const response = await fetch(NEWS_FILE, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Failed to load news.json: ${response.status}`
          );
        }

        newsItems = await response.json();

        if (!Array.isArray(newsItems)) {
          throw new Error("news.json must contain an array.");
        }

        renderNews();
      } catch (error) {
        console.error(error);

        statusMessage.textContent =
          "뉴스를 불러오지 못했습니다. news.json 파일을 확인해 주세요.";
      }
    }

    function renderNews() {
      const title =
        currentLanguage === "ko" ? "뉴스" : "NEWS";

      sectionTitle.textContent = title;
      document.documentElement.lang = currentLanguage;

      newsList.innerHTML = "";

      newsItems.forEach((item) => {
        const listItem = document.createElement("li");
        const localizedText = item[currentLanguage];

        if (!localizedText) {
          return;
        }

        const formattedDate =
          currentLanguage === "ko"
            ? convertDateToKorean(item.date)
            : item.date;

        listItem.innerHTML =
          `<span class="news-date">(${formattedDate})</span> ` +
          localizedText;

        newsList.appendChild(listItem);
      });

      languageButtons.forEach((button) => {
        const isActive =
          button.dataset.language === currentLanguage;

        button.classList.toggle("active", isActive);
        button.setAttribute(
          "aria-pressed",
          String(isActive)
        );
      });

      statusMessage.hidden = true;
      newsList.hidden = false;
    }

    function convertDateToKorean(date) {
      const [month, year] = date.split("/");

      if (!month || !year) {
        return date;
      }

      return `${year}.${month}`;
    }

    function changeLanguage(language) {
      currentLanguage = language;

      localStorage.setItem(
        "evlab-news-language",
        currentLanguage
      );

      renderNews();
    }

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        changeLanguage(button.dataset.language);
      });
    });

    loadNews();
  </script>
</body>
</html>
